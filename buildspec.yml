version: 0.2

phases:
  build:
    commands:
      - echo "CODEBUILD_SRC_DIR is:"
      - echo $CODEBUILD_SRC_DIR

      - echo "Listing source directory"
      - ls -R $CODEBUILD_SRC_DIR

      - echo "Creating artifact directories"
      - mkdir -p artifacts/glue artifacts/lambda

      - echo "Copying Glue job"
      - cp $CODEBUILD_SRC_DIR/glue/jobs/sample_glue_job.py artifacts/glue/

      - echo "Zipping Lambda code"
      - zip -j artifacts/lambda/sample_lambda.zip $CODEBUILD_SRC_DIR/lambda/functions/sample_lambda.py

artifacts:
  base-directory: artifacts
  files:
    - "**/*"
