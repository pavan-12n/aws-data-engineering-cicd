version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies"
      - pip install -r requirements.txt

  pre_build:
    commands:
      - echo "Running tests"
      - pytest || echo "No tests found"

  build:
    commands:
      - echo "Packaging Glue and Lambda code"
      - mkdir -p artifacts/glue artifacts/lambda
      - cp -r glue/jobs/* artifacts/glue/
      - cp -r lambda/functions/* artifacts/lambda/

artifacts:
  files:
    - artifacts/**/*
